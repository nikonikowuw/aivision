# 应用配置：APP_* 环境变量可覆盖（如 APP_DB_DRIVER、APP_DB_PASSWORD、APP_JWT_SECRET、APP_JWT_SECURE_COOKIE）
server:
  port: 8000
db:
  driver: postgres # mysql | postgres（决策 18）；切 postgres 时改驱动并调整 host/port/user/password/name
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "postgres" # 开发默认；生产用 APP_DB_PASSWORD 覆盖
  name: niko_vue_admin_go
  time_zone: Asia/Shanghai
  auto_migrate: true # dev/test 启动时自动建表；生产发版设为 false，表结构变更走 app/migrations SQL 脚本
  max_open: 100
  max_idle: 10
  max_lifetime: 30m
jwt:
  secret: "dev-secret-change-me" # 生产用 APP_JWT_SECRET 覆盖
  access_ttl: 2h
  refresh_ttl: 168h
  secure_cookie: false # 本地 HTTP 开发关闭；生产 HTTPS 用 APP_JWT_SECURE_COOKIE=true
log:
  level: info
storage:
  driver: local # local | minio
  max_size: 10485760 # 10 MiB per file; override with APP_STORAGE_MAX_SIZE
  local:
    root: ./uploads
    url_prefix: /uploads
  minio:
    endpoint: 127.0.0.1:9000
    access_key: "" # MinIO driver: use APP_STORAGE_MINIO_ACCESS_KEY
    secret_key: "" # MinIO driver: use APP_STORAGE_MINIO_SECRET_KEY
    bucket: niko-vue-admin
    use_ssl: false
    public_base_url: http://127.0.0.1:9000/niko-vue-admin
