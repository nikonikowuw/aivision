# 应用配置：APP_* 环境变量可覆盖（如 APP_DB_PASSWORD、APP_JWT_SECRET、APP_JWT_SECURE_COOKIE）
server:
  port: 8000
# 数据库 schema 由 `go run ./cmd/migrate up` 管理，API 启动不会自动建表
db:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "postgres" # 开发默认；生产用 APP_DB_PASSWORD 覆盖
  name: aivision
  time_zone: Asia/Shanghai
  max_open: 100
  max_idle: 10
  max_lifetime: 30m
jwt:
  secret: "dev-secret-change-me" # 生产用 APP_JWT_SECRET 覆盖
  access_ttl: 2h
  refresh_ttl: 168h
  secure_cookie: false # 本地 HTTP 开发关闭；生产 HTTPS 用 APP_JWT_SECURE_COOKIE=true
log:
  level: info
storage:
  driver: local # local | minio
  max_size: 10485760 # 10 MiB per file; override with APP_STORAGE_MAX_SIZE
  local:
    root: ./uploads
    url_prefix: /uploads
  minio:
    endpoint: 127.0.0.1:9000
    access_key: "" # MinIO driver: use APP_STORAGE_MINIO_ACCESS_KEY
    secret_key: "" # MinIO driver: use APP_STORAGE_MINIO_SECRET_KEY
    bucket: niko-vue-admin
    use_ssl: false
    public_base_url: http://127.0.0.1:9000/niko-vue-admin
network:
  state_dir: /var/lib/aivision/network
  profile_path: /etc/aivision/network-profile.json
  confirm_timeout: 120s
  fake_platform: true
# gRPC over Unix Domain Socket：app.sock 由本进程监听（Engine 回调），engine.sock 供本进程调用 C++ Engine
# 开发默认可用 APP_IPC_APP_SOCKET/APP_IPC_ENGINE_SOCKET 覆盖；生产使用唯一的 AIVISION_ENGINE_PROFILE。
ipc:
  app_socket: /tmp/aivision-app.sock
  engine_socket: /tmp/aivision-engine.sock
open:
  person_sync_allowed_ips: []
