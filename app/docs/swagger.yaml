host: localhost:8000
info:
  contact: {}
  description: niko-vue-admin 后端 API 接口文档
  title: niko-vue-admin API
  version: "1.0"
paths:
  /api/auth/codes:
    get:
      description: 获取当前登录用户拥有的全部按钮权限码
      produces:
      - application/json
      responses:
        "200":
          description: 权限码列表
          schema:
            $ref: '#/definitions/internal_api.AccessCodesResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/niko-vue-admin_app_internal_pkg_response.Result'
      security:
      - BearerAuth: []
      summary: 获取当前用户权限码集合
      tags:
      - 认证模块
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录获取 AccessToken，同时在 Cookie 中写入 RefreshToken
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回用户信息及 AccessToken
          schema:
            $ref: '#/definitions/internal_api.LoginResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/niko-vue-admin_app_internal_pkg_response.Result'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/niko-vue-admin_app_internal_pkg_response.Result'
      summary: 用户登录
      tags:
      - 认证模块
  /api/auth/logout:
    post:
      description: 注销当前的 RefreshToken 并清除客户端 Cookie
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/internal_api.NilResponse'
      summary: 用户登出
      tags:
      - 认证模块
  /api/auth/refresh:
    post:
