services:
  # Backend Go API Service (Embedded SQLite with WAL mode)
  server:
    build:
      context: ../argus
      dockerfile: Dockerfile
    container_name: argus-backend
    restart: unless-stopped
    environment:
      APP_SERVER_PORT: 8000
      APP_DB_PATH: /app/data/argus.db
      APP_JWT_SECRET: dev-secret-change-me-in-production
      APP_JWT_SECURE_COOKIE: "false"
      APP_LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - argus_data:/app/data
      - uploads_data:/app/uploads

  # Frontend Web & Nginx Proxy
  web:
    image: nginx:alpine
    container_name: argus-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    volumes:
      - ../ui/apps/web-antd/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  argus_data:
  uploads_data:
