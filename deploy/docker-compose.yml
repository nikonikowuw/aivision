services:
  # Argus Web Control Plane (Single binary with embedded Vue UI + API + SQLite)
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: argus-server
    restart: unless-stopped
    environment:
      APP_SERVER_PORT: 8000
      APP_DB_PATH: /app/data/argus.db
      APP_JWT_SECRET: dev-secret-change-me-in-production
      APP_JWT_SECURE_COOKIE: "false"
      APP_LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - argus_data:/app/data
      - uploads_data:/app/uploads

volumes:
  argus_data:
  uploads_data:
