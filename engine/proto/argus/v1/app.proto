syntax = "proto3";

package argus.v1;

import "argus/v1/common.proto";
import "argus/v1/engine.proto";

option go_package = "argus/app/internal/proto/argus/v1;argusv1";

// 告警事件上报
message AlarmEvent {
  // 目标级全局事件 ID = "<instance_run_id>/<batch_event_id>-<target_sequence>"（Engine 生成）；
  // 一个检测批次会被 Engine fan-out 为多条 AlarmEvent，因此该 ID 不能复用批次 ID，
  // Go 必须按本字段幂等去重（对齐 runtime-guidelines §6）
  string event_id = 1;
  // 稳定实例配置 ID（对应 AlgorithmInstanceConfig.instance_id）
  string instance_id = 2;
  string camera_id = 3;
  string algorithm_id = 4;
  string algorithm_version = 5;
  string alarm_type_id = 6;
  int64 wall_time_ns = 7;
  bool time_synced = 8;
  // 目标级事件恰好包含一个检测目标；同一批次的事件可共享 image_id。
  repeated DetectedObject objects = 9;
  string image_id = 10;
  string image_rel_path = 11; // 规范化相对路径；禁止绝对路径；同批次事件可复用
  int64 inference_duration_us = 12;
  int64 e2e_duration_us = 13;
}

message ReportAlarmRequest {
  AlarmEvent alarm = 1;
}

message ReportAlarmResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 车牌识别通行观测事件上报
message PlateObservation {
  // 目标级全局事件 ID = "<instance_run_id>/<batch_event_id>-<track_id>"
  string event_id = 1;
  string instance_id = 2;
  string camera_id = 3;
  string algorithm_id = 4;
  string algorithm_version = 5;
  int64 wall_time_ns = 6;
  bool time_synced = 7;
  int64 track_id = 8;
  string plate_text = 9;
  string normalized_text = 10;
  string plate_color = 11;
  string plate_type = 12;
  float confidence = 13;
  float ocr_confidence = 14;
  BoundingBox plate_bbox = 15;
  BoundingBox vehicle_bbox = 16;
  string image_id = 17;
  string image_rel_path = 18;
  string plate_image_id = 19;
  string plate_image_rel_path = 20;
}

message ReportPlateObservationRequest {
  PlateObservation observation = 1;
}

message ReportPlateObservationResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 人脸比对候选条目（用于 Top-K 候选匹配排查与溯源）
message FaceCandidate {
  string face_id = 1;
  string person_id = 2;
  string person_name = 3;     // 底库快照
  float similarity = 4;       // 归一化 [0,1]
}

// 人脸识别通行观测事件上报
message FaceObservation {
  // 目标级全局事件 ID = "<instance_run_id>/<track_id>"，track 稳定，覆盖上报时不变
  string event_id = 1;
  string instance_id = 2;
  string camera_id = 3;
  string algorithm_id = 4;
  string algorithm_version = 5;
  int64 wall_time_ns = 6;
  bool time_synced = 7;
  int64 track_id = 8;
  string face_id = 9;          // 命中的底库条目
  string person_id = 10;
  string person_name = 11;     // 底库快照，Go 侧直接落库不再回查
  float similarity = 12;       // 归一化 [0,1]
  BoundingBox face_bbox = 13;
  string image_id = 14;        // 全景图
  string image_rel_path = 15;
  string face_image_id = 16;   // 人脸特写图
  string face_image_rel_path = 17;
  string camera_name = 18;      // 摄像头名称快照，可为空
  repeated FaceCandidate candidates = 19; // Top-K 候选识别结果（通常 Top-5，降序）
}

message ReportFaceObservationRequest {
  FaceObservation observation = 1;
}

message ReportFaceObservationResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 单张时序人脸抓拍快照
message FaceCaptureSnapshot {
  int32 snapshot_index = 1;
  int64 wall_time_ns = 2;
  bool time_synced = 3;
  BoundingBox face_bbox = 4;
  float quality_score = 5;
  float similarity = 6;
  string face_id = 7;
  string person_id = 8;
  string person_name = 9;
  string image_id = 10;
  string image_rel_path = 11;
  string face_image_id = 12;
  string face_image_rel_path = 13;
  repeated FaceCandidate candidates = 14; // Top-K 候选识别结果（通常 Top-5，降序）
}

// 人脸抓拍全量事件上报（包含陌生人与已知人，单 Track 支持 1~5 组增量上报）
message FaceCapture {
  // 目标级全局事件 ID = "<instance_run_id>/<track_id>"
  string event_id = 1;
  string instance_id = 2;
  string camera_id = 3;
  string camera_name = 4;
  string algorithm_id = 5;
  string algorithm_version = 6;
  int64 track_id = 7;
  FaceCaptureSnapshot snapshot = 8;
}

message ReportFaceCaptureRequest {
  FaceCapture capture = 1;
}

message ReportFaceCaptureResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}


// 任务运行状态
enum TaskStatusCode {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_STARTING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_DEGRADED = 3;
  TASK_STATUS_RECONNECTING = 4;
  TASK_STATUS_STOPPED = 5;
  TASK_STATUS_ERROR = 6;
}

message TaskState {
  string camera_id = 1;
  TaskStatusCode status = 2;
  string message = 3;
  int64 last_frame_wall_time_ns = 4;
}

message ReportTaskStateRequest {
  TaskState task_state = 1;
}

message ReportTaskStateResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 实例运行状态
enum InstanceStatusCode {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_STARTING = 1;
  INSTANCE_STATUS_RUNNING = 2;
  INSTANCE_STATUS_DEGRADED = 3;
  INSTANCE_STATUS_STOPPED = 4;
  INSTANCE_STATUS_ERROR = 5;
}

message InstanceState {
  string instance_id = 1;
  InstanceStatusCode status = 2;
  string message = 3;
  float current_fps = 4;
}

message ReportInstanceStateRequest {
  InstanceState instance_state = 1;
}

message ReportInstanceStateResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 设备遥测指标上报
message ReportMetricsRequest {
  DeviceTelemetry telemetry = 1;
}

message ReportMetricsResponse {
  string code = 1;          // 空串表示接受
  string error_message = 2; // 诊断信息，客户端不得解析其文本
}

// 孤儿图片元数据与对账上报
message OrphanImageEntry {
  // 全局事件 ID，与 AlarmEvent.event_id 同形（<instance_run_id>/<algo_event_id>）
  string event_id = 1;
  string image_id = 2;
  string relative_path = 3;
  int64 created_at_ns = 4;
}

message ReportOrphanImagesRequest {
  repeated OrphanImageEntry orphan_images = 1;
}

message ReportOrphanImagesResponse {
  repeated string retain_image_ids = 1; // Go 告知 Engine 需要保留的已引用图片 ID
  repeated string delete_image_ids = 2; // Go 告知 Engine 可以安全物理删除的孤儿图片 ID
  string code = 3;          // 空串表示接受
  string error_message = 4; // 诊断信息，客户端不得解析其文本
}

// 期望状态拉取请求
message GetDesiredStateRequest {
  uint64 current_revision = 1;
}

message GetDesiredStateResponse {
  DesiredState desired_state = 1;
  string code = 2;          // 空串表示成功
  string error_message = 3; // 诊断信息，客户端不得解析其文本
}

// 单条人脸底库条目
message FaceGalleryEntry {
  string face_id = 1;
  string person_id = 2;
  string person_name = 3;      // 冗余，供 Engine 上报时携带历史快照
  bytes embedding = 4;         // 512 维 L2 归一化 float32 小端字节流（精确 2048 字节）
}

message GetFaceGalleryRequest {
  uint64 current_gallery_revision = 1;
}

message GetFaceGalleryResponse {
  uint64 gallery_revision = 1;
  bool changed = 2;                        // false 时 entries 必为空
  repeated FaceGalleryEntry entries = 3;   // changed=true 时为全量快照
  string code = 4;
  string error_message = 5;
}

// ControlPlaneService: 运行在 Go 服务（绑定 app.sock），供 C++ 引擎拉取期望状态
service ControlPlaneService {
  rpc GetDesiredState(GetDesiredStateRequest) returns (GetDesiredStateResponse);
  rpc GetFaceGallery(GetFaceGalleryRequest) returns (GetFaceGalleryResponse);
}

// ReportService: 运行在 Go 服务（绑定 app.sock），供 C++ 引擎异步上报事件与指标
service ReportService {
  rpc ReportAlarm(ReportAlarmRequest) returns (ReportAlarmResponse);
  rpc ReportPlateObservation(ReportPlateObservationRequest) returns (ReportPlateObservationResponse);
  rpc ReportFaceObservation(ReportFaceObservationRequest) returns (ReportFaceObservationResponse);
  rpc ReportFaceCapture(ReportFaceCaptureRequest) returns (ReportFaceCaptureResponse);
  rpc ReportTaskState(ReportTaskStateRequest) returns (ReportTaskStateResponse);
  rpc ReportInstanceState(ReportInstanceStateRequest) returns (ReportInstanceStateResponse);
  rpc ReportMetrics(ReportMetricsRequest) returns (ReportMetricsResponse);
  rpc ReportOrphanImages(ReportOrphanImagesRequest) returns (ReportOrphanImagesResponse);
}
